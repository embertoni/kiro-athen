<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Athen logo">
  <title>Athen</title>
  <!-- Purple crescent moon: an outer disc with an offset disc carved out,
       opening toward the lower-right and tapering as it wraps. -->
  <path
    fill="#5B2A86"
    fill-rule="evenodd"
    d="M32 2a30 30 0 1 0 0 60 30 30 0 0 1 0-60zM41 10a24.5 24.5 0 1 1 0 44 29.5 29.5 0 0 0 0-44z"
  />
  <!-- Thin background-colored ring so the crescent inner edge and gold circle
       read as distinct shapes. -->
  <circle cx="41" cy="34" r="17.5" fill="#ffffff" />
  <!-- Gold/yellow filled circle nested in the crescent's opening. -->
  <circle cx="41" cy="34" r="15.5" fill="#FFC107" />
  <!-- Small downward-pointing purple triangle in the upper-right quadrant. -->
  <path fill="#5B2A86" d="M40 24h11l-5.5 10z" />
</svg>
